<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#14b8a6" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="255" x2="600" y2="255"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- ESL Device cards -->
  <g>
    <!-- Device 1 -->
    <rect x="40" y="80" width="90" height="56" rx="6" fill="url(#card)" opacity="0.9"/>
    <rect x="46" y="88" width="78" height="14" rx="2" fill="#ccfbf1" opacity="0.3"/>
    <text x="85" y="114" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#fbbf24">£2.49</text>
    <rect x="46" y="120" width="50" height="5" rx="2" fill="#99f6e4" opacity="0.4"/>
    <!-- wifi dots -->
    <circle cx="112" cy="92" r="2" fill="#5eead4"/>
    <circle cx="118" cy="92" r="2" fill="#5eead4" opacity="0.5"/>
    <circle cx="124" cy="92" r="2" fill="#5eead4" opacity="0.25"/>

    <!-- Device 2 -->
    <rect x="150" y="80" width="90" height="56" rx="6" fill="url(#card)" opacity="0.85"/>
    <rect x="156" y="88" width="78" height="14" rx="2" fill="#ccfbf1" opacity="0.3"/>
    <text x="195" y="114" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#fbbf24">£4.99</text>
    <rect x="156" y="120" width="60" height="5" rx="2" fill="#99f6e4" opacity="0.4"/>
    <circle cx="222" cy="92" r="2" fill="#5eead4"/>
    <circle cx="228" cy="92" r="2" fill="#5eead4" opacity="0.5"/>
    <circle cx="234" cy="92" r="2" fill="#5eead4" opacity="0.25"/>

    <!-- Device 3 -->
    <rect x="260" y="80" width="90" height="56" rx="6" fill="url(#card)" opacity="0.8"/>
    <rect x="266" y="88" width="78" height="14" rx="2" fill="#ccfbf1" opacity="0.3"/>
    <text x="305" y="114" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#fbbf24">£12.00</text>
    <rect x="266" y="120" width="45" height="5" rx="2" fill="#99f6e4" opacity="0.4"/>
    <circle cx="332" cy="92" r="2" fill="#5eead4"/>
    <circle cx="338" cy="92" r="2" fill="#5eead4" opacity="0.5"/>
    <circle cx="344" cy="92" r="2" fill="#5eead4" opacity="0.25"/>
  </g>

  <!-- MQTT flow arrows -->
  <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="5,3">
    <line x1="85" y1="155" x2="85" y2="195"/>
    <line x1="195" y1="155" x2="195" y2="195"/>
    <line x1="305" y1="155" x2="305" y2="195"/>
  </g>
  <!-- Arrow heads -->
  <polygon points="85,200 80,190 90,190" fill="#fbbf24" opacity="0.7"/>
  <polygon points="195,200 190,190 200,190" fill="#fbbf24" opacity="0.7"/>
  <polygon points="305,200 300,190 310,190" fill="#fbbf24" opacity="0.7"/>

  <!-- MQTT Broker box -->
  <rect x="60" y="200" width="280" height="50" rx="8" fill="#1e3a3a" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="200" y="221" text-anchor="middle" font-family="monospace" font-size="11" fill="#5eead4" letter-spacing="1">MQTT BROKER</text>
  <text x="200" y="240" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="10" fill="#99f6e4" opacity="0.7">Elixir / Phoenix Backend</text>

  <!-- Connecting line to server -->
  <line x1="345" y1="225" x2="400" y2="225" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <polygon points="405,225 396,220 396,230" fill="#14b8a6" opacity="0.6"/>

  <!-- Server box -->
  <rect x="405" y="200" width="145" height="50" rx="8" fill="#1e3a3a" stroke="#0f766e" stroke-width="1.5"/>
  <text x="478" y="221" text-anchor="middle" font-family="monospace" font-size="10" fill="#5eead4" letter-spacing="1">DOCKER</text>
  <text x="478" y="240" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="10" fill="#99f6e4" opacity="0.7">Keycloak · OAuth2</text>

  <!-- Badge -->
  <rect x="370" y="30" width="190" height="38" rx="8" fill="#fbbf24" opacity="0.12" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <text x="465" y="51" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="12" font-weight="700" fill="#fbbf24">100+ ESL Devices — UK Retail</text>

  <!-- Title -->
  <text x="30" y="305" font-family="'Segoe UI', Arial" font-size="20" font-weight="800" fill="#ffffff">ESL Retail Automation Backend</text>
  <text x="30" y="325" font-family="monospace" font-size="11" fill="#5eead4" opacity="0.8">Elixir · Phoenix · MQTT · Docker · Keycloak</text>
</svg>
